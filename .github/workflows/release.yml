name: Release

# Build the maic binary and publish it as a GitHub Release whenever a
# version tag (v*) is pushed. Runs on a native arm64 macOS 26 runner so the
# FoundationModels SDK is available. Note: CI cannot smoke-test the binary
# (GitHub runners have no Apple Intelligence), so this verifies compile +
# packaging only.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required for `gh release create`

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Derive version and stage name
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "STAGE=maic-${VERSION}-macos-arm64" >> "$GITHUB_ENV"

      - name: Bake version into the binary
        run: |
          cat > Sources/maic/Version.swift <<EOF
          // Generated by .github/workflows/release.yml at release time.
          let maicVersion = "${VERSION}"
          EOF

      - name: Build (release, arm64)
        run: swift build -c release

      - name: Test
        run: swift run maicTests

      - name: Ad-hoc sign
        run: codesign -s - --force .build/release/maic

      - name: Package
        run: |
          mkdir "$STAGE"
          cp .build/release/maic "$STAGE/"
          cp README.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          cat "${STAGE}.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE \
            "${STAGE}.tar.gz" \
            "${STAGE}.tar.gz.sha256"
